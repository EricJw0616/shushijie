<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>书世界 · 图书知识库（版式原型）</title>
<style>
:root{
  --bg:#F4F3EE; --panel:#FFFFFF; --ink:#20241F; --muted:#72766C; --faint:#9A9D94;
  --line:#E6E3D9; --line2:#EFEDE5; --brand:#1E2B25; --brand2:#2B3B33;
  --gold:#B08D57; --gold2:#9A7434; --gold-soft:#F4EBDD;
  --green:#3D6B4F; --green-soft:#EAF2EC; --amber:#93652A; --amber-soft:#FBF0DC;
  --red:#A44435; --red-soft:#FAECE8; --violet:#5C4A72; --violet-soft:#F1ECF6;
  --shadow:0 1px 2px rgba(28,32,27,.04),0 8px 24px rgba(28,32,27,.045);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{cursor:pointer;text-decoration:none;color:inherit}
button{font-family:inherit}
.shell{display:flex;min-height:100vh}
/* ============ 侧栏 ============ */
.sidebar{width:236px;flex-shrink:0;background:var(--brand);color:#C8D2C9;position:fixed;inset:0 auto 0 0;z-index:30;display:flex;flex-direction:column;padding:20px 14px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#C7A566,#9A7434);display:flex;align-items:center;justify-content:center;color:#1E2B25;font-family:"Songti SC","Noto Serif SC",serif;font-size:20px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand b{display:block;color:#F3EFE4;font-family:"Songti SC","Noto Serif SC",serif;font-size:19px;letter-spacing:2px;line-height:1.2}
.brand span{display:block;font-size:10.5px;color:#8F9C90;letter-spacing:1.5px;margin-top:2px}
.workspace{display:flex;align-items:center;gap:8px;margin:0 4px 12px;padding:7px 10px;border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(255,255,255,.035);font-size:11.5px;color:#B9C5BA}
.workspace .ws-dot{width:7px;height:7px;border-radius:50%;background:#7FAE88;box-shadow:0 0 0 3px rgba(127,174,136,.12)}
.workspace span{margin-left:auto;color:#7E8C80}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.nav-label{font-size:9px;letter-spacing:1.5px;color:#6F7D72;padding:10px 12px 4px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:7px;color:#B9C5BA;font-size:12.5px;cursor:pointer;position:relative;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.055);color:#EEE9DD}
.nav-item.on{background:rgba(176,141,87,.16);color:#F1E7D2}
.nav-item.on:before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;border-radius:2px;background:var(--gold)}
.nav-item .ico{width:16px;text-align:center;color:#8E9C90;font-size:13px}
.nav-item.on .ico{color:var(--gold)}
.nav-item .count{margin-left:auto;font-size:10px;color:#8E9C90;background:rgba(255,255,255,.06);border-radius:10px;padding:1px 6px}
.nav-item .soon{margin-left:auto;font-size:8.5px;letter-spacing:.5px;color:#9A8A69;background:rgba(176,141,87,.12);border:1px solid rgba(176,141,87,.18);border-radius:4px;padding:0 4px}
.nav-item .dot{margin-left:auto;width:6px;height:6px;border-radius:50%;background:#C9A45C}
.sidebar-foot{margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding:10px 6px 0;display:flex;align-items:center;gap:9px;color:#C8D2C9}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,#C7A566,#9A7434);color:#1E2B25;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sidebar-foot b{display:block;font-size:11.5px;color:#E7E1D3;font-weight:600;line-height:1.3}
.sidebar-foot small{display:block;font-size:10px;color:#7E8C80}
.sidebar-foot .more{margin-left:auto;color:#7E8C80;font-size:14px}
/* ============ 主区 ============ */
.main{flex:1;margin-left:236px;min-width:0}
.topbar{height:62px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 30px;position:sticky;top:0;z-index:20}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.crumb b{color:var(--ink);font-weight:600}
.top-search{margin-left:auto;width:330px;position:relative}
.top-search input{width:100%;height:34px;border:1px solid var(--line);background:#FAF9F5;border-radius:8px;padding:0 34px 0 12px;font-family:inherit;font-size:12px;color:var(--ink);outline:none}
.top-search input:focus{border-color:#CDB58B;background:#fff}
.top-search kbd{position:absolute;right:8px;top:8px;font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:#fff}
.icon-btn{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:#CDB58B;color:var(--gold2)}
.topbar .avatar{width:30px;height:30px}
.view{max-width:1360px;margin:0 auto;padding:28px 32px 70px}
/* ============ 通用 ============ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:9.5px;letter-spacing:1.6px;color:var(--gold2);text-transform:uppercase;font-weight:600;margin-bottom:5px}
h1{font-size:24px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.page-head p{font-size:12px;color:var(--muted);margin-top:5px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#CDB58B}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#F4EFE1}
.btn.primary:hover{background:var(--brand2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:11.5px}
.btn.ghost{background:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line2)}
.panel-head h2{font-size:13.5px;font-weight:600}
.panel-head .sub{font-size:11px;color:var(--muted);margin-top:2px}
.panel-head a{font-size:11.5px;color:var(--gold2)}
.panel-body{padding:16px 18px}
.muted{color:var(--muted);font-size:11.5px}
.faint{color:var(--faint);font-size:11px}
.gold{color:var(--gold2)}
.pill{display:inline-flex;align-items:center;padding:1px 7px;border-radius:5px;font-size:10.5px;background:#F3F1EA;color:#666A60;white-space:nowrap;line-height:1.7}
.pill.p1{background:var(--green-soft);color:var(--green)}.pill.p2{background:#E8F0F5;color:#3E6680}
.pill.p3{background:var(--amber-soft);color:var(--amber)}.pill.p4{background:#F8EBE6;color:#A4553C}
.pill.p5{background:var(--violet-soft);color:var(--violet)}.pill.p6{background:#EEF1E5;color:#5D6B3C}
.pill.p7{background:#FBF0DE;color:#8A5E2A}.pill.p8{background:#E8F1EE;color:#387062}
.pill.p9{background:#F1EFE8;color:#666A60}.pill.p10{background:#F3EDE4;color:#785A38}
.pill.p11{background:#EDF0F7;color:#455A8A}
.status{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.status.ok{background:var(--green-soft);color:var(--green)}
.status.wait{background:var(--amber-soft);color:var(--amber)}
.status.fail{background:var(--red-soft);color:var(--red)}
.status.info{background:#EEF1F5;color:#4C647C}
/* ============ 工作台 ============ */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);opacity:.55}
.kpi .k{font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.5px;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:10.5px;color:var(--faint);margin-top:3px}
.kpi .d b{color:var(--green);font-weight:600}
.grid-2{display:grid;grid-template-columns:1.35fr .95fr;gap:16px}
.grid-2.lower{grid-template-columns:1fr 1fr;margin-top:16px}
.recent{display:flex;flex-direction:column}
.recent-row{display:flex;align-items:center;gap:11px;padding:10px 18px;border-bottom:1px solid var(--line2);cursor:pointer}
.recent-row:last-child{border-bottom:none}
.recent-row:hover{background:#FBFAF6}
.mini-cover{width:30px;height:40px;border-radius:4px;background:linear-gradient(145deg,#EFE4C8,#D8C08E);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;font-size:13px;color:#755A24}
.recent-main{flex:1;min-width:0}
.recent-main b{display:block;font-family:"Songti SC","Noto Serif SC",serif;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-main span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-row .pill{flex-shrink:0}
.bars{display:flex;flex-direction:column;gap:11px;padding:17px 18px}
.bar-row{display:grid;grid-template-columns:74px 1fr 28px;align-items:center;gap:9px;font-size:11px}
.bar-row .name{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:6px;background:#F1EFE8;border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#C9AB6F,#A8843F)}
.bar-row .n{text-align:right;color:var(--faint);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 18px}
.quick a{display:flex;gap:9px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line2);border-radius:8px;background:#FBFAF6}
.quick a:hover{border-color:#D7C29A;background:#fff}
.quick .qico{width:28px;height:28px;border-radius:7px;background:var(--gold-soft);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.quick b{display:block;font-size:11.5px;font-weight:600}
.quick span{display:block;font-size:10px;color:var(--muted);margin-top:1px;line-height:1.45}
/* ============ 表格 ============ */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line2)}
.filters .search{flex:1;min-width:220px;position:relative}
.filters .search input{width:100%;height:31px;border:1px solid var(--line);border-radius:7px;background:#FAF9F5;padding:0 11px;font-family:inherit;font-size:11.5px;outline:none}
.filters .search input:focus{border-color:#CDB58B;background:#fff}
select{height:31px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-family:inherit;font-size:11.5px;color:#555A51;outline:none}
.table{width:100%;border-collapse:collapse;font-size:11.5px}
.table th{text-align:left;padding:9px 14px;background:#FAF9F5;border-bottom:1px solid var(--line);color:var(--faint);font-weight:500;font-size:10px;letter-spacing:.4px;white-space:nowrap}
.table td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tbody tr{cursor:pointer}
.table tbody tr:hover{background:#FBFAF6}
.table .bookcell{display:flex;align-items:center;gap:10px;min-width:230px}
.table .bookcell .mini-cover{width:26px;height:35px;font-size:11px}
.table .bookcell b{display:block;font-family:"Songti SC","Noto Serif SC",serif;font-size:12px;font-weight:600;line-height:1.35}
.table .bookcell span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.table .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.table .right{text-align:right}
.table .chev{color:#C9C5BA;font-size:14px;text-align:right}
.table input[type=checkbox]{accent-color:var(--gold2);width:13px;height:13px}
.table-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--line2);font-size:10.5px;color:var(--muted)}
.pager{display:flex;gap:4px;align-items:center}
.pager button{width:25px;height:25px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:10.5px;color:var(--muted);cursor:pointer}
.pager button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* ============ 书详情 ============ */
.crumbs{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--gold2)}
.book-hero{display:flex;gap:20px;padding:22px;align-items:flex-start;margin-bottom:14px}
.book-cover{width:92px;height:126px;border-radius:6px;background:linear-gradient(145deg,#F0E5CA,#D7BF8C);border:1px solid #D9C496;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Songti SC","Noto Serif SC",serif;font-size:36px;color:#755A24;position:relative;box-shadow:0 6px 16px rgba(80,60,20,.08)}
.book-cover:after{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(117,90,36,.15)}
.hero-main{flex:1;min-width:0}
.hero-main .eyebrow{margin-bottom:3px}
.hero-main h1{font-family:"Songti SC","Noto Serif SC",serif;font-size:25px;font-weight:700;letter-spacing:.5px}
.hero-main .meta{font-size:11.5px;color:var(--muted);margin-top:5px}
.hero-main .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.hero-stats{display:flex;gap:22px;align-items:flex-end;flex-shrink:0;padding-top:4px}
.hero-stats .hs{text-align:right}
.hero-stats .hs b{display:block;font-size:18px;font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.hero-stats .hs span{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 16px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 13px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--gold2);border-bottom-color:var(--gold);font-weight:600}
.detail-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.detail-grid .panel{margin:0}
.profile-table{width:100%;border-collapse:collapse;font-size:11.5px}
.profile-table th{width:92px;color:var(--muted);text-align:left;font-weight:400;padding:8px 12px 8px 0;vertical-align:top;border-bottom:1px solid var(--line2)}
.profile-table td{padding:8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
.profile-table tr:last-child th,.profile-table tr:last-child td{border-bottom:none}
.metric4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.metric4 .m{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.metric4 .m b{display:block;font-size:20px;font-weight:600;line-height:1.3}
.metric4 .m span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
.cand-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cand-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:10.5px;color:var(--muted);cursor:pointer}
.cand-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cand{border:1px solid var(--line2);border-radius:8px;padding:11px 13px;margin-bottom:8px;background:#FCFBF7}
.cand-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.cand-text{font-family:"Songti SC","Noto Serif SC",serif;font-size:12px;line-height:1.8;color:#3B3A32}
.cand-meta{font-size:10px;color:var(--faint);margin-top:5px}
.layer{border:1px solid var(--line2);border-radius:8px;padding:11px 13px;margin-bottom:8px;background:#FCFBF7}
.layer-h{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
.layer-h b{font-size:11.5px;color:var(--gold2)}
.layer-h span{font-size:10px;color:var(--faint)}
.tagchip{display:inline-block;background:#F3F1EA;color:#5A574C;border-radius:4px;padding:1px 7px;font-size:10.5px;margin:2px 4px 2px 0;cursor:pointer}
.tagchip.l7{background:var(--violet-soft);color:var(--violet)}
.outline{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow:auto;margin-bottom:12px}
.outline button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 8px;font-size:10.5px;color:var(--muted);cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outline button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.seg{border:1px solid var(--line2);border-radius:7px;padding:10px 12px;margin-bottom:7px;background:#FCFBF7}
.seg .anch{font-size:9.5px;color:var(--gold2);margin-bottom:3px}
.seg .txt{font-family:"Songti SC","Noto Serif SC",serif;font-size:11.5px;line-height:1.9;color:#3B3A32;white-space:pre-wrap}
.empty{padding:34px 16px;text-align:center;color:var(--faint);font-size:11.5px}
/* ============ 任务 / 上传 ============ */
.upload-panel{padding:18px;display:grid;grid-template-columns:1.1fr 1.4fr;gap:20px;margin-bottom:16px}
.drop{border:1.5px dashed #D5C39E;border-radius:10px;background:#FDFBF5;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:126px}
.drop .big{font-size:12.5px;font-weight:600;color:var(--gold2)}
.drop .small{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}
.field input{width:100%;height:31px;border:1px solid var(--line);border-radius:7px;padding:0 10px;font-family:inherit;font-size:11.5px;outline:none;background:#fff}
.field input:focus{border-color:#CDB58B}
.field.full{grid-column:1/-1}
.task-status{display:inline-flex;align-items:center;gap:4px}
/* ============ 能力矩阵 ============ */
.matrix-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
.matrix{border-collapse:collapse;font-size:10.5px;min-width:900px;width:100%}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);border-right:1px solid #F2F0E8;padding:6px 7px;text-align:center;white-space:nowrap}
.matrix th{background:#FAF9F5;color:var(--faint);font-weight:500;position:sticky;top:0}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:#FAF9F5;z-index:1;min-width:88px}
.matrix td:first-child{background:#fff}
.matrix .pname{font-weight:600;color:var(--ink)}
.matrix .pname small{display:block;font-weight:400;color:var(--faint);font-size:9px}
.matrix input{accent-color:var(--gold2);width:12px;height:12px}
/* ============ 其它 ============ */
.kv-note{background:#FCFAF4;border:1px solid #EEE5D2;border-radius:8px;padding:9px 11px;font-size:10.5px;color:#7A6640;line-height:1.65}
.section-title{font-size:12.5px;font-weight:600;margin-bottom:9px}
.section-title span{font-weight:400;color:var(--faint);font-size:10.5px;margin-left:6px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}
.list-row:last-child{border-bottom:none}
.list-row .main{flex:1;min-width:0}
.list-row b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row span{display:block;font-size:10px;color:var(--muted)}
.proto-bars{display:flex;flex-direction:column;gap:9px}
.proto-bar{display:grid;grid-template-columns:72px 1fr 28px;align-items:center;gap:8px;font-size:10.5px}
.proto-bar .t{height:6px;background:#F1EFE8;border-radius:99px;overflow:hidden}
.proto-bar .f{height:100%;background:linear-gradient(90deg,#C9AB6F,#A8843F);border-radius:99px}
.proto-bar .n{text-align:right;color:var(--faint)}
.search-page .big-search{display:flex;gap:8px;margin-bottom:14px}
.search-page .big-search input{flex:1;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 13px;font-family:inherit;font-size:12px;outline:none}
.search-page .big-search input:focus{border-color:#CDB58B}
.result-sec{margin-bottom:16px}
.result-sec h3{font-size:11px;color:var(--gold2);margin-bottom:7px;letter-spacing:.4px}
.result{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:11.5px}
.result:last-child{border-bottom:none}
.result .r-main{flex:1;min-width:0}
.result b{font-weight:600}
.result .r-meta{font-size:10px;color:var(--faint);margin-top:2px}
mark{background:#F8E7B7;color:#6B531D;border-radius:2px;padding:0 1px}
.proto-note{font-size:9.5px;color:#8E8A7D;text-align:center;padding:8px 0 0}

/* 平台架构条 / 应用层 */
.arch{display:flex;align-items:stretch;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:16px;box-shadow:var(--shadow)}
.arch-step{flex:1;min-width:0;padding:9px 12px;border-radius:8px;background:#FBFAF6;border:1px solid var(--line2)}
.arch-step.on{background:#F8F4EA;border-color:#E4D4B5}
.arch-step b{display:block;font-size:11.5px;font-weight:600;color:var(--ink)}
.arch-step span{display:block;font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arch-step em{display:inline-block;font-style:normal;font-size:9px;color:var(--gold2);margin-top:4px;background:var(--gold-soft);border-radius:4px;padding:0 5px}
.arch-arrow{display:flex;align-items:center;color:#C9BFA9;font-size:14px}
.apps-list{padding:6px 18px}
.app-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.app-row:last-child{border-bottom:none}
.app-row:hover .app-main b{color:var(--gold2)}
.app-ico{width:28px;height:28px;border-radius:7px;background:var(--gold-soft);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.app-main{flex:1;min-width:0}
.app-main b{display:block;font-size:11.5px;font-weight:600}
.app-main span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.progress-row{margin-bottom:11px}
.pr-top{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:4px}
.pr-top b{font-weight:500;color:#555A51}
.pr-top span{color:var(--faint)}
.pr-track{height:5px;background:#F1EFE8;border-radius:99px;overflow:hidden}
.pr-track i{display:block;height:100%;background:linear-gradient(90deg,#C9AB6F,#A8843F);border-radius:99px}
.app-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.app-card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 17px;box-shadow:var(--shadow);scroll-margin-top:80px}
.app-card.focus{border-color:#CDB58B;box-shadow:0 0 0 3px rgba(176,141,87,.12),var(--shadow)}
.app-card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.app-card-ico{width:34px;height:34px;border-radius:9px;background:var(--gold-soft);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:16px}
.app-card h3{font-size:14px;font-weight:600;margin-bottom:3px}
.app-card p{font-size:11px;color:var(--muted);line-height:1.65;min-height:37px}
.app-req{display:flex;gap:4px;flex-wrap:wrap;margin:9px 0 12px}
.app-req span{font-size:9.5px;color:#6B6558;background:#F3F1EA;border-radius:4px;padding:1px 6px}
.app-card-f{display:flex;gap:7px;justify-content:flex-end;border-top:1px solid var(--line2);padding-top:11px}
.api-grid{display:flex;flex-direction:column;gap:0}
.api-row{display:grid;grid-template-columns:220px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:10.5px}
.api-row:last-child{border-bottom:none}
.api-row code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;color:#5B5446;background:#F6F4EE;border:1px solid var(--line2);border-radius:4px;padding:2px 5px;justify-self:start}
.api-row span{color:var(--muted)}
.api-row em{font-style:normal}
@media(max-width:1100px){.arch{flex-direction:column}.arch-arrow{display:none}.app-grid{grid-template-columns:1fr}.api-row{grid-template-columns:1fr auto}.api-row span{grid-column:1/-1}}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2.lower,.detail-grid,.split{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}.hero-stats{display:none}}
@media(max-width:840px){.sidebar{width:64px;padding:14px 8px}.brand b,.brand span,.workspace,.nav-label,.nav-item span:not(.ico):not(.count),.sidebar-foot b,.sidebar-foot small,.sidebar-foot .more{display:none}.brand{justify-content:center;padding-bottom:12px}.nav-item{justify-content:center;padding:9px 0}.nav-item .count{display:none}.main{margin-left:64px}.top-search{display:none}.view{padding:18px 16px 60px}.upload-panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">书</div>
      <div><b>书世界</b><span>图书知识库</span></div>
    </div>
    <div class="workspace"><span class="ws-dot"></span>果麦文化 · 内容中台<span>⌄</span></div>
    <nav>
      <div class="nav-label">概览</div>
      <div class="nav-item on" data-view="dashboard"><span class="ico">◫</span><span>工作台</span></div>
      <div class="nav-label">数据资产</div>
      <div class="nav-item" data-view="library"><span class="ico">▤</span><span>图书库</span><span class="count" id="navBookCount">—</span></div>
      <div class="nav-item" data-view="tasks"><span class="ico">↥</span><span>入库任务</span><span class="dot"></span></div>
      <div class="nav-item" data-view="assets"><span class="ico">◇</span><span>知识资产</span></div>
      <div class="nav-item" data-view="archive"><span class="ico">▦</span><span>图书档案</span></div>
      <div class="nav-item" data-view="search"><span class="ico">⌕</span><span>全局检索</span></div>
      <div class="nav-label">应用</div>
      <div class="nav-item" data-view="apps"><span class="ico">✦</span><span>应用中心</span><span class="count">4</span></div>
      <div class="nav-label">平台</div>
      <div class="nav-item" data-view="settings"><span class="ico">⚙</span><span>解析能力</span></div>
      <div class="nav-item" onclick="alert('规划中：数据源与开放 API')"><span class="ico">⇄</span><span>数据源与 API</span><span class="soon">soon</span></div>
      <div class="nav-item" onclick="alert('规划中：成员与权限')"><span class="ico">◎</span><span>成员与权限</span><span class="soon">soon</span></div>
      <div class="nav-item" data-view="trash"><span class="ico">♻</span><span>回收站</span></div>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar">朱</div>
      <div><b>朱老师</b><small>管理员</small></div>
      <span class="more">⋯</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="crumb" id="crumb"><span>工作台</span></div>
      <div class="top-search">
        <input id="globalQ" placeholder="搜索图书、知识条目、标签…">
        <kbd>⌘K</kbd>
      </div>
      <button class="btn primary sm" onclick="go('tasks')">＋ 上传图书</button>
      <button class="icon-btn" title="帮助">?</button>
      <div class="avatar">朱</div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<script>
'use strict';
const state = {books:[], stats:{}, groups:[], settings:null, jobs:[], trash:[], bookCache:{}, detailTab:'overview', tier:'', book:{}, loadError:''};
const PROTO = {P1:'规范型',P2:'知识型',P3:'论说型',P4:'叙事型',P5:'戏曲型',P6:'散文型',P7:'韵文集型',P8:'条目型',P9:'选集笺注型',P10:'笔记志书型',P11:'图鉴型'};
const LAYERS = [['L3','类型','这本书属于哪一类'],['L5','能力','能提供什么内容资产'],['L4','内容','书里写了什么'],['L6','概念','哪一段在讲道理'],['L7','议题','能对上哪些议题'],['L2','语体','用什么语言写的'],['L1','结构','怎么编的'],['L0','原文','内容是否完整可检索']];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(n){return n==null||n===''?'—':Number(n).toLocaleString('zh-CN');}
function pct(n){return n==null||n===''?'—':Number(n).toFixed(1)+'%';}
function clip(s,n){s=String(s==null?'':s).replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n)+'…':s;}
function arr(v){return Array.isArray(v)?v:[];}
function coverChar(t){const s=String(t||'').replace(/^\s*\d{4}\s*版?/,'');const m=s.match(/[\u3400-\u9FFF\uF900-\uFAFF]/);return m?m[0]:'书';}
function pill(p){return `<span class="pill ${String(p||'').toLowerCase()}">${esc(p||'—')} ${esc(PROTO[p]||'待分类')}</span>`;}
function status(r){if(r.status==='pending')return '<span class="status wait">待确认</span>';if(r.status==='failed')return '<span class="status fail">异常</span>';if(r.confirmed)return '<span class="status ok">已确认</span>';return '<span class="status ok">已入库</span>';}
function ago(s){if(!s)return '—';return String(s).replace('T',' ').slice(0,10);}

async function jget(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
async function boot(){
  try{
    const d=await jget('/api/books');
    state.books=d.books||[];state.stats=d.stats||{};state.groups=d.groups||[];
  }catch(e){state.loadError=e.message;}
  try{state.settings=await jget('/api/settings');}catch(e){}
  try{const d=await jget('/api/jobs');state.jobs=d.jobs||[];}catch(e){}
  try{const d=await jget('/api/trash');state.trash=d.items||[];}catch(e){}
  const c=document.getElementById('navBookCount');if(c)c.textContent=state.stats.books||state.books.length||'—';
  route();
}

function go(view,arg){const h='#/'+view+(arg!==undefined&&arg!==''?'/'+encodeURIComponent(arg):'');if(location.hash===h)route();else location.hash=h;}
function parse(){const h=(location.hash||'').replace(/^#\/?/,'');if(!h)return{view:'dashboard',arg:''};const p=h.split('/');return{view:p[0],arg:decodeURIComponent(p.slice(1).join('/'))};}
function setNav(v){const map={dashboard:'dashboard',library:'library',book:'library',tasks:'tasks',assets:'assets',archive:'archive',search:'search',apps:'apps',settings:'settings',trash:'trash'};const cur=map[v]||v;document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('on',x.dataset.view===cur));}
function crumb(html){document.getElementById('crumb').innerHTML=html;}
async function route(){
  const {view,arg}=parse();setNav(view);
  const v=document.getElementById('view');
  if(view==='dashboard'){crumb('<span>工作台</span>');return renderDashboard(v);}
  if(view==='library'){crumb('<span>数据资产</span><span>/</span><b>图书库</b>');return renderLibrary(v);}
  if(view==='book'){return renderBook(v,arg);}
  if(view==='tasks'){crumb('<span>数据资产</span><span>/</span><b>入库任务</b>');return renderTasks(v);}
  if(view==='assets'){crumb('<span>数据资产</span><span>/</span><b>知识资产</b>');return renderAssets(v);}
  if(view==='archive'){crumb('<span>数据资产</span><span>/</span><b>图书档案</b>');return renderArchive(v);}
  if(view==='search'){crumb('<span>数据资产</span><span>/</span><b>全局检索</b>');return renderSearch(v);}
  if(view==='apps'){crumb('<span>应用</span><span>/</span><b>应用中心</b>');return renderApps(v,arg);}
  if(view==='settings'){crumb('<span>系统</span><span>/</span><b>解析能力</b>');return renderSettings(v);}
  if(view==='trash'){crumb('<span>系统</span><span>/</span><b>回收站</b>');return renderTrash(v);}
  go('dashboard');
}

/* ================= 工作台 ================= */
function renderDashboard(v){
  const s=state.stats;
  const total=state.books.length;
  const cats={};state.books.forEach(b=>{const k=b.prototype||'—';cats[k]=(cats[k]||0)+1;});
  const order=Object.keys(PROTO);
  const recent=state.books.slice().sort((a,b)=>(b.added_at||'').localeCompare(a.added_at||'')).slice(0,6);
  const max=Math.max(...Object.values(cats),1);
  const apps=[
    ['智能问答','基于图书资产回答，答案带原文出处','待接入','qa','◈'],
    ['知识图谱','人物 / 地点 / 机构关系，按需展开','待接入','graph','◉'],
    ['营销物料','金句、卖点、推荐语，从原文取素材','规划中','marketing','◇'],
    ['开放 API','检索、知识条目、数据集导出','设计','api','⇄'],
  ];
  v.innerHTML=`
    <div class="page-head">
      <div><div class="eyebrow">Platform Overview</div><h1>平台概览</h1>
        <p>数据资产是平台的第一个模块；应用层不重复造数据，统一消费图书资产与知识条目。当前接入的是「图书库」，应用层按路线图逐步接入。</p></div>
      <div class="head-actions"><button class="btn ghost" onclick="go('apps')">应用中心</button><button class="btn primary" onclick="go('tasks')">＋ 上传图书</button></div>
    </div>
    <div class="arch">
      <div class="arch-step on"><b>01 数据资产</b><span>图书库 · 知识条目 · 标签</span><em>已可用</em></div>
      <div class="arch-arrow">→</div>
      <div class="arch-step"><b>02 统一资产接口</b><span>检索 / 详情 / 导出 / 事件</span><em>部分可用</em></div>
      <div class="arch-arrow">→</div>
      <div class="arch-step"><b>03 应用层</b><span>问答 · 图谱 · 营销 · API</span><em>待接入</em></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="k">图书资产</div><div class="v">${num(total)}</div><div class="d"><b>+1</b> 本周新增</div></div>
      <div class="kpi"><div class="k">知识条目</div><div class="v">${num(s.cards)}</div><div class="d">其中可直接用 ${num(s.usable)} 条</div></div>
      <div class="kpi"><div class="k">已接入应用</div><div class="v">0<span style="font-size:14px;color:var(--faint)"> / 4</span></div><div class="d">应用层接入位已预留</div></div>
      <div class="kpi"><div class="k">待处理</div><div class="v">${num(s.pending)}</div><div class="d">分类待确认 / 任务异常</div></div>
    </div>
    <div class="grid-2">
      <section class="panel">
        <div class="panel-head"><div><h2>最近入库</h2><div class="sub">数据资产模块的最新变化</div></div><a onclick="go('library')">查看全部 →</a></div>
        <div class="recent">${recent.map(b=>`<div class="recent-row" onclick="go('book','${esc(b.code)}')">
          <div class="mini-cover">${esc(coverChar(b.book))}</div>
          <div class="recent-main"><b>${esc(b.book)}</b><span>${esc(b.author||'作者未填写')} · ${num(b.segments)} 段 · ${num(b.cards)} 条知识</span></div>
          ${pill(b.prototype)}${status(b)}
        </div>`).join('')}</div>
      </section>
      <section class="panel">
        <div class="panel-head"><div><h2>应用层</h2><div class="sub">统一消费资产，不另建一套数据</div></div><a onclick="go('apps')">应用中心 →</a></div>
        <div class="apps-list">${apps.map(([name,desc,st,key,ico])=>`<div class="app-row" onclick="go('apps','${key}')"><span class="app-ico">${ico}</span><div class="app-main"><b>${name}</b><span>${desc}</span></div><span class="status ${st==='已接入'?'ok':st==='待接入'?'wait':'info'}">${st}</span></div>`).join('')}</div>
      </section>
    </div>
    <div class="grid-2 lower">
      <section class="panel">
        <div class="panel-head"><div><h2>数据资产快捷入口</h2><div class="sub">先把第一模块用顺，再逐步接应用</div></div></div>
        <div class="quick">
          <a onclick="go('tasks')"><span class="qico">↥</span><span><b>上传图书</b><span>txt / docx / 文本型 PDF</span></span></a>
          <a onclick="go('library')"><span class="qico">▤</span><span><b>浏览图书库</b><span>筛选、检索、查看档案</span></span></a>
          <a onclick="go('assets')"><span class="qico">◇</span><span><b>知识资产</b><span>按图书查看可交付内容</span></span></a>
          <a onclick="go('settings')"><span class="qico">⚙</span><span><b>解析能力</b><span>配置每类书的抽取能力</span></span></a>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head"><div><h2>接入进度</h2><div class="sub">应用层商业化的前提</div></div></div>
        <div class="panel-body">
          ${[['图书资产库','已就绪',100],['检索与详情接口','已就绪',100],['向量索引 / 语义检索','待接入',35],['账号 / 权限 / 计费','规划中',15]].map(([n,st,w])=>`<div class="progress-row"><div class="pr-top"><b>${n}</b><span>${st}</span></div><div class="pr-track"><i style="width:${w}%"></i></div></div>`).join('')}
          <div class="kv-note" style="margin-top:12px">应用层接入应走统一资产接口：/api/books、/api/book、/api/book/cards、/api/book/tags、/api/search；后续加向量检索与数据集导出，不再让每个应用直读文件。</div>
        </div>
      </section>
    </div>`;
}

/* ================= 应用中心 ================= */
function renderApps(v,focus){
  const apps=[
    ['qa','智能问答','基于图书段落与知识条目回答，答案带原文出处；适合编辑、客服、读者服务。','待接入',['检索接口','原文定位','权限'],'◈'],
    ['graph','知识图谱','人物 / 地点 / 机构关系与共现网络；先服务选题与内容理解，再考虑可视化产品。','待接入',['实体候选','关系校验','图谱准入'],'◉'],
    ['marketing','营销物料','从原文与知识条目出金句、卖点、推荐语；每一句必须能回到原文。','规划中',['知识条目','原文引用','人工确认'],'◇'],
    ['api','开放 API','检索、知识条目、数据集导出；面向内部系统和合作方，按 Key / 配额 / 审计管理。','设计',['API Key','限流','审计日志'],'⇄'],
  ];
  v.innerHTML=`
    <div class="page-head"><div><div class="eyebrow">Applications</div><h1>应用中心</h1><p>应用层是平台的第二阶段：每个应用只消费统一资产接口，不各自维护一套图书数据。当前先把接入位、资产口径和权限边界定清楚。</p></div>
      <div class="head-actions"><button class="btn ghost" onclick="alert('原型预览：接入申请')">申请接入</button></div></div>
    <div class="arch" style="margin-bottom:16px">
      <div class="arch-step on"><b>资产层</b><span>图书库 · 知识条目 · 标签</span><em>已可用</em></div>
      <div class="arch-arrow">→</div>
      <div class="arch-step"><b>接口层</b><span>检索 / 详情 / 导出 / 事件</span><em>部分可用</em></div>
      <div class="arch-arrow">→</div>
      <div class="arch-step"><b>应用层</b><span>问答 / 图谱 / 物料 / API</span><em>待接入</em></div>
    </div>
    <div class="app-grid">${apps.map(([key,name,desc,st,req,ico])=>`<section class="app-card ${focus===key?'focus':''}" id="app-${key}">

        <p>共 ${num(state.books.length)} 本图书；这里是内容资产的入口，不再把统计、上传、详情、后台全部堆在一个页面。</p></div>

    </div>
    <section class="panel">
      <div class="filters">
        <div class="search"><input id="libQ" placeholder="搜索书名 / 作者 / 图书编号"></div>
        <select id="libType"><option value="">全部类型</option>${Object.keys(PROTO).map(p=>`<option value="${p}">${p} ${PROTO[p]}</option>`).join('')}</select>
        <select id="libStatus"><option value="">全部状态</option><option value="pending">待确认</option><option value="ready">已入库</option></select>
        <select id="libSource"><option value="">全部来源</option><option value="base">基准库</option><option value="upload">新入库</option></select>
      </div>
      <div id="libTable"></div>
      <div class="table-foot"><span id="libCount">—</span><div class="pager"><button>‹</button><button class="on">1</button><button>2</button><button>3</button><button>›</button></div></div>
    </section>`;
  const draw=()=>{
    const q=(document.getElementById('libQ').value||'').toLowerCase();
    const t=document.getElementById('libType').value,st=document.getElementById('libStatus').value,so=document.getElementById('libSource').value;
    let rows=state.books.filter(b=>{
      if(q&&![b.book,b.author,b.code,b.prototype_name].join(' ').toLowerCase().includes(q))return false;
      if(t&&b.prototype!==t)return false;
      if(st==='pending'&&b.status!=='pending')return false;
      if(st==='ready'&&b.status==='pending')return false;
      if(so&&b.source!==so)return false;
      return true;
    });
    document.getElementById('libCount').textContent=`显示 ${rows.length} / ${state.books.length} 本`;
    document.getElementById('libTable').innerHTML=`<table class="table">
      <thead><tr><th style="width:30px"><input type="checkbox"></th><th>图书</th><th>类型</th><th>状态</th><th class="num">内容量</th><th class="num">知识条目</th><th class="num">标签</th><th>入库时间</th><th></th></tr></thead>
      <tbody>${rows.map(b=>`<tr onclick="go('book','${esc(b.code)}')">
        <td onclick="event.stopPropagation()"><input type="checkbox"></td>
        <td><div class="bookcell"><div class="mini-cover">${esc(coverChar(b.book))}</div><div><b>${esc(b.book)}</b><span>${esc(b.author||'作者未填写')} · ${esc(b.code)}</span></div></div></td>
        <td>${pill(b.prototype)}</td><td>${status(b)}</td>
        <td class="num">${num(b.segments)} 段<br><span class="faint">${num(b.han)} 字</span></td>
        <td class="num">${num(b.cards)}</td><td class="num">${num(b.tags)}</td>
        <td>${ago(b.added_at)}</td><td class="chev">›</td>
      </tr>`).join('')}</tbody></table>`;
  };
  ['libQ','libType','libStatus','libSource'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
  draw();
}

async function loadCards(){

function loadText(btn,chapter){document.querySelectorAll('#outlineBox button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');loadSegments(chapter);}
async function loadSegments(chapter){

}

    const rows=state.books.filter(b=>!q||[b.book,b.code,b.prototype,b.prototype_name].join(' ').toLowerCase().includes(q));
    document.getElementById('arcTable').innerHTML=`<table class="table"><thead><tr><th>图书</th><th>分类</th><th>状态</th><th class="num">内容段</th><th class="num">知识条目</th><th class="num">标签</th><th>入库时间</th><th></th></tr></thead>
      <tbody>${rows.map(b=>`<tr onclick="go('book','${esc(b.code)}')"><td><div class="bookcell"><div class="mini-cover">${esc(coverChar(b.book))}</div><div><b>${esc(b.book)}</b><span>${esc(b.code)}</span></div></div></td><td>${pill(b.prototype)}</td><td>${status(b)}</td><td class="num">${num(b.segments)}</td><td class="num">${num(b.cards)}</td><td class="num">${num(b.tags)}</td><td>${ago(b.added_at)}</td><td class="chev">›</td></tr>`).join('')}</tbody></table>`;
  };
  document.getElementById('arcQ').addEventListener('input',draw);draw();
}

/* ================= 全局检索 ================= */
function renderSearch(v){
  v.innerHTML=`
    <div class="page-head"><div><div class="eyebrow">Operations / Search</div><h1>全局检索</h1><p>跨图书查知识条目、标签、原文。检索是独立页面，不塞进图书库的工具条里。</p></div></div>
    <section class="panel search-page"><div class="panel-body">
      <div class="big-search"><input id="searchQ" placeholder="例：五事 / 权力与秩序 / 祥林嫂" value="五事"><button class="btn primary" onclick="runSearch()">检索</button></div>
      <div id="searchOut" class="muted">输入关键词后检索。</div>
    </div></section>`;
  document.getElementById('searchQ').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});
  runSearch();
}
async function runSearch(){
  const q=(document.getElementById('searchQ').value||'').trim();const out=document.getElementById('searchOut');if(!q)return;
  out.innerHTML='<div class="empty">检索中…</div>';
  try{
    const d=await jget('/api/search?'+new URLSearchParams({q,scope:'all',limit:'8'}).toString());
    out.innerHTML=[['图书',d.books],['标签',d.tags],['知识条目',d.cards],['原文',d.segments]].map(([name,items])=>items&&items.length?`<div class="result-sec"><h3>${name} ${items.length}</h3>${items.map(x=>`<div class="result" onclick="go('book','${esc(x.code)}')"><div class="r-main"><b>${esc(x.book||x.tag||x.type||'')}</b><div class="r-meta">${esc(x.anchor||x.layer||'')} ${esc(clip(x['原文']||'',100))}</div></div><span class="chev">›</span></div>`).join('')}</div>`:'').join('')||'<div class="empty">没有命中</div>';
  }catch(e){out.innerHTML=`<div class="empty">检索失败：${esc(e.message)}</div>`;}
}

/* ================= 解析能力 ================= */
function renderSettings(v){
  const d=state.settings;
  if(!d){v.innerHTML='<div class="panel"><div class="empty">能力配置加载失败</div></div>';return;}
  const labels=d.labels||[],protos=d.protos||[],cur=d.current||{},conf=d.confirm||{};
  v.innerHTML=`
    <div class="page-head"><div><div class="eyebrow">System / Capability</div><h1>解析能力</h1><p>按图书类型配置抽取能力。改动只影响之后新跑或重跑的书，历史资产不自动变化。</p></div>
      <div class="head-actions"><button class="btn ghost" onclick="alert('原型预览：恢复默认')">恢复默认</button><button class="btn primary" onclick="alert('原型预览：保存配置')">保存设置</button></div></div>
    <section class="panel"><div class="panel-head"><div><h2>能力矩阵</h2><div class="sub">行 = 图书类型，列 = 抽取器；「索引」类能力不算交付资产</div></div></div><div class="panel-body">
      <div class="matrix-wrap"><table class="matrix"><thead><tr><th>图书类型</th>${labels.map(l=>`<th title="${esc((conf[l]||{})['说明']||'')}">${esc(l)}</th>`).join('')}</tr></thead>
      <tbody>${protos.map(p=>`<tr><td class="pname">${p.key} ${esc(p.name)}<small>${(cur[p.key]||[]).length} 项</small></td>${labels.map(l=>`<td><input type="checkbox" ${(cur[p.key]||[]).includes(l)?'checked':''}></td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="kv-note" style="margin-top:12px">商用版建议：能力配置按「工作空间 / 图书类型」两级管理，并保留变更记录与回滚；原型先展示矩阵。</div>
    </div></section>
    <section class="panel" style="margin-top:16px"><div class="panel-head"><h2>只读阈值</h2><span class="faint">由全库实测倒推，不随单本书调整</span></div><div class="panel-body">
      <div class="split">${[['整本最低汉字',num(d.thresholds.MIN_HAN)],['最低汉字率',pct(d.thresholds.MIN_HAN_RATIO)],['最长平均句长',num(d.thresholds.MAX_SAVG)],['图谱强证据人物',num(d.thresholds['图谱强证据人物'])]].map(([k,val])=>`<div class="list-row"><div class="main"><b>${k}</b><span>全局生效</span></div><span class="faint">${val}</span></div>`).join('')}</div>
    </div></section>`;
}

/* ================= 回收站 ================= */
function renderTrash(v){
  v.innerHTML=`<div class="page-head"><div><div class="eyebrow">System / Trash</div><h1>回收站</h1><p>删除是软删除：底本与产物保留，可在保留期内恢复。</p></div></div>
    <section class="panel">${state.trash.length?`<table class="table"><thead><tr><th>图书</th><th>编号</th><th>删除时间</th><th></th></tr></thead><tbody>${state.trash.map(t=>`<tr><td>${esc(t.book)}</td><td>${esc(t.code)}</td><td>${esc((t.time||'').replace('T',' ').slice(0,16))}</td><td class="right"><button class="btn sm ghost">恢复</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">回收站是空的</div>'}</section>`;
}

document.querySelectorAll('.nav-item').forEach(x=>x.addEventListener('click',()=>go(x.dataset.view)));
window.addEventListener('hashchange',route);
boot();
</script>
</body>
