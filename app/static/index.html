<script>
(function(){
  var menu=document.getElementById('studioMenu'),sidebar=document.getElementById('studioSidebar');
  function syncNav(){var small=window.matchMedia('(max-width:840px)').matches,open=small&&document.body.classList.contains('nav-open');sidebar.inert=small&&!open;document.querySelector('.main').inert=open;menu.setAttribute('aria-expanded',String(open));}
  function closeNav(){document.body.classList.remove('nav-open');syncNav();}
  menu.addEventListener('click',function(){var open=document.body.classList.toggle('nav-open');syncNav();if(open)sidebar.querySelector('.nav-item.on,.nav-item').focus();});
  window.addEventListener('resize',syncNav);syncNav();
  document.querySelector('.sidebar-overlay').addEventListener('click',closeNav);
  sidebar.querySelectorAll('.nav-item').forEach(function(b){b.addEventListener('click',closeNav);});
  sidebar.addEventListener('click',function(e){if(e.target.closest('.project-nav-item'))closeNav();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&document.body.classList.contains('nav-open')){closeNav();menu.focus();}});
  window.addEventListener('hashchange',closeNav);
})();
</script>
