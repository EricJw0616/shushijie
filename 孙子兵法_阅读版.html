<script>
const D=[{"n": "第一", "t": "始計篇", "s": "始计篇", "p": ["孫子曰：兵者，國之大事，死生之地，存亡之道，不可不察也。", "故經之以五事，校之以計，而索其情。", "一曰道，二曰天，三曰地，四曰將，五曰法。", "道者，令民與上同意，可與之死，可與之生，而不畏危也。", "天者，陰陽、寒暑、時制也。地者，逺近、險易、廣狹、死生也。將者，智、信、仁、勇、嚴也。法者，曲制、官道、主用也。凡此五者，將莫不聞，知之者勝，不知者不勝。", "故校之以計，而索其情，曰：主孰有道？將孰有能？天地孰得？法令孰行？兵衆孰强？士卒孰練？賞罰孰明？吾以此知勝負矣。", "將聽吾計，用之必勝，留之；將不聽吾計，用之必敗，去之。", "計利以聽，乃為之勢，以佐其外。勢者，因利而制權也。", "兵者，詭道也。故能而示之不能，用而示之不用，近而示之逺，逺而示之近。利而誘之，亂而取之，實而備之，强而避之，怒而撓之，卑而驕之，佚而勞之，親而離之。攻其無備，出其不意。此兵家之勝，不可先傳也。", "夫未戰而廟算勝者，得算多也；未戰而廟算不勝者，得算少也。多算勝，少算不勝，而况於無算乎？吾於此觀之，勝負見矣。"], "ps": ["孙子曰：兵者，国之大事，死生之地，存亡之道，不可不察也。", "故经之以五事，校之以计，而索其情。", "一曰道，二曰天，三曰地，四曰将，五曰法。", "道者，令民与上同意，可与之死，可与之生，而不畏危也。", "天者，阴阳、寒暑、时制也。地者，远近、险易、广狭、死生也。将者，智、信、仁、勇、严也。法者，曲制、官道、主用也。凡此五者，将莫不闻，知之者胜，不知者不胜。", "故校之以计，而索其情，曰：主孰有道？将孰有能？天地孰得？法令孰行？兵众孰强？士卒孰练？赏罚孰明？吾以此知胜负矣。", "将听吾计，用之必胜，留之；将不听吾计，用之必败，去之。", "计利以听，乃为之势，以佐其外。势者，因利而制权也。", "兵者，诡道也。故能而示之不能，用而示之不用，近而示之远，远而示之近。利而诱之，乱而取之，实而备之，强而避之，怒而挠之，卑而骄之，佚而劳之，亲而离之。攻其无备，出其不意。此兵家之胜，不可先传也。", "夫未战而庙算胜者，得算多也；未战而庙算不胜者，得算少也。多算胜，少算不胜，而况于无算乎？吾于此观之，胜负见矣。"], "note": ["「吾於此觀之」，通行本作「吾以此觀之」。"]}, {"n": "第二", "t": "作戰篇", "s": "作战篇", "p": ["孫子曰：凡用兵之法，馳車千駟，革車千乘，帶甲十萬，千里饋糧，内外之費，賓客之用，膠漆之材，車甲之奉，日費千金，然後十萬之師舉矣。", "其用戰也勝，久則鈍兵挫鋭，攻城則力屈，久暴師則國用不足。", "夫鈍兵挫鋭，屈力殫貨，則諸侯乗其弊而起，雖有智者，不能善其後矣。故兵聞拙速，未覩巧之久也。夫兵久而國利者，未之有也。故不盡知用兵之害者，則不能盡知用兵之利也。", "善用兵者，役不再籍，糧不三載；取用於國，因糧於敵，故軍食可足也。", "國之貧於師者逺輸，逺輸則百姓貧；近師者貴賣，貴賣則百姓財竭，財竭則急於丘役。力屈財殫，中原内虚於家。", "百姓之費，十去其七；公家之費，破車罷馬，甲胄弓矢，㦸楯矛櫓，丘牛大車，十去其六。", "故智將務食於敵：食敵一鍾，當吾二十鍾；芑秆一石，當吾二十石。", "故殺敵者，怒也；取敵之利者，貨也。", "車戰，得車十乗以上，賞其先得者，而更其旌旗，車雜而乗之，卒善而養之，是謂勝敵而益强。", "故兵貴勝，不貴久。", "故知兵之將，民之司命，國家安危之主也。"], "ps": ["孙子曰：凡用兵之法，驰车千驷，革车千乘，带甲十万，千里馈粮，内外之费，宾客之用，胶漆之材，车甲之奉，日费千金，然后十万之师举矣。", "其用战也胜，久则钝兵挫锐，攻城则力屈，久暴师则国用不足。", "夫钝兵挫锐，屈力殚货，则诸侯乘其弊而起，虽有智者，不能善其后矣。故兵闻拙速，未睹巧之久也。夫兵久而国利者，未之有也。故不尽知用兵之害者，则不能尽知用兵之利也。", "善用兵者，役不再籍，粮不三载；取用于国，因粮于敌，故军食可足也。", "国之贫于师者远输，远输则百姓贫；近师者贵卖，贵卖则百姓财竭，财竭则急于丘役。力屈财殚，中原内虚于家。", "百姓之费，十去其七；公家之费，破车罢马，甲胄弓矢，戟盾矛橹，丘牛大车，十去其六。", "故智将务食于敌：食敌一钟，当吾二十钟；芑秆一石，当吾二十石。", "故杀敌者，怒也；取敌之利者，货也。", "车战，得车十乘以上，赏其先得者，而更其旌旗，车杂而乘之，卒善而养之，是谓胜敌而益强。", "故兵贵胜，不贵久。", "故知兵之将，民之司命，国家安危之主也。"], "note": ["「食敵一鍾，當吾二十鍾；□秆一石」，底本此字为阙文（Kanripo 原文件标记为未解码字符），通行本作「芑秆」（芑，豆秸）。今补「芑」。"]}, {"n": "第三", "t": "謀攻篇", "s": "谋攻篇", "p": ["孫子曰：夫用兵之法，全國為上，破國次之；全軍為上，破軍次之；全旅為上，破旅次之；全卒為上，破卒次之；全伍為上，破伍次之。", "是故百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。", "故上兵伐謀，其次伐交，其次伐兵，其下攻城。攻城之法，為不得已。", "修櫓轒轀，具器械，三月而後成；距闉，又三月而後已。將不勝其忿而蟻附之，殺士卒三分之一，而城不拔者，此攻之災也。", "故善用兵者，屈人之兵而非戰也，拔人之城而非攻也，毁人之國而非久也，必以全爭於天下。故兵不頓而利可全，此謀攻之法也。", "故用兵之法，十則圍之，五則攻之，倍則分之，敵則能戰之，少則能守之，不若則能避之。故小敵之堅，大敵之擒也。", "夫將者，國之輔也。輔周則國必强，輔隙則國必弱。", "故軍之所以患於君者三：不知軍之不可以進而謂之進，不知軍之不可以退而謂之退，是謂縻軍；不知三軍之事，而同三軍之政，則軍士惑矣；不知三軍之權，而同三軍之任，則軍士疑矣。", "三軍既惑且疑，則諸侯之難至矣，是謂亂軍引勝。", "故知勝有五：知可以與戰不可以與戰者勝，識衆寡之用者勝，上下同欲者勝，以虞待不虞者勝，將能而君不御者勝。此五者，知勝之道也。", "故曰：知彼知己，百戰不殆；不知彼而知己，一勝一負；不知彼，不知己，每戰必敗。"], "ps": ["孙子曰：夫用兵之法，全国为上，破国次之；全军为上，破军次之；全旅为上，破旅次之；全卒为上，破卒次之；全伍为上，破伍次之。", "是故百战百胜，非善之善者也；不战而屈人之兵，善之善者也。", "故上兵伐谋，其次伐交，其次伐兵，其下攻城。攻城之法，为不得已。", "修橹轒辒，具器械，三月而后成；距闉，又三月而后已。将不胜其忿而蚁附之，杀士卒三分之一，而城不拔者，此攻之灾也。", "故善用兵者，屈人之兵而非战也，拔人之城而非攻也，毁人之国而非久也，必以全争于天下。故兵不顿而利可全，此谋攻之法也。", "故用兵之法，十则围之，五则攻之，倍则分之，敌则能战之，少则能守之，不若则能避之。故小敌之坚，大敌之擒也。", "夫将者，国之辅也。辅周则国必强，辅隙则国必弱。", "故军之所以患于君者三：不知军之不可以进而谓之进，不知军之不可以退而谓之退，是谓縻军；不知三军之事，而同三军之政，则军士惑矣；不知三军之权，而同三军之任，则军士疑矣。", "三军既惑且疑，则诸侯之难至矣，是谓乱军引胜。", "故知胜有五：知可以与战不可以与战者胜，识众寡之用者胜，上下同欲者胜，以虞待不虞者胜，将能而君不御者胜。此五者，知胜之道也。", "故曰：知彼知己，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必败。"], "note": ["「故軍之所以患於君者三」，通行本作「故君之所以患於軍者三」，底本文意倒置。", "「少則能守之」，通行本作「少則能逃之」；《集注》本正作「逃」。"]}, {"n": "第四", "t": "軍形篇", "s": "军形篇", "p": ["孫子曰：昔之善戰者，先為不可勝，以待敵之可勝。", "不可勝在已，可勝在敵。故善戰者，能為不可勝，不能使敵之必可勝。故曰：勝可知，而不可為。", "不可勝者，守也；可勝者，攻也。守則不足，攻則有餘。", "善守者，藏於九地之下；善攻者，動於九天之上。故能自保而全勝也。", "見勝不過衆人之所知，非善之善者也；戰勝而天下曰善，非善之善者也。故舉秋毫不為多力，見日月不為明目，聞雷霆不為聰耳。", "古之所謂善戰者，勝於易勝者也。故善戰者之勝也，無智名，無勇功。故其戰勝不忒。不忒者，其所措勝，勝已敗者也。", "故善戰者，立於不敗之地，而不失敵之敗也。是故勝兵先勝而後求戰，敗兵先戰而後求勝。善用兵者，修道而保法，故能為勝敗之政。", "兵法：一曰度，二曰量，三曰數，四曰稱，五曰勝。地生度，度生量，量生數，數生稱，稱生勝。", "故勝兵若以鎰稱銖，敗兵若以銖稱鎰。勝者之戰，若決積水於千仞之谿者，形也。"], "ps": ["孙子曰：昔之善战者，先为不可胜，以待敌之可胜。", "不可胜在已，可胜在敌。故善战者，能为不可胜，不能使敌之必可胜。故曰：胜可知，而不可为。", "不可胜者，守也；可胜者，攻也。守则不足，攻则有余。", "善守者，藏于九地之下；善攻者，动于九天之上。故能自保而全胜也。", "见胜不过众人之所知，非善之善者也；战胜而天下曰善，非善之善者也。故举秋毫不为多力，见日月不为明目，闻雷霆不为聪耳。", "古之所谓善战者，胜于易胜者也。故善战者之胜也，无智名，无勇功。故其战胜不忒。不忒者，其所措胜，胜已败者也。", "故善战者，立于不败之地，而不失敌之败也。是故胜兵先胜而后求战，败兵先战而后求胜。善用兵者，修道而保法，故能为胜败之政。", "兵法：一曰度，二曰量，三曰数，四曰称，五曰胜。地生度，度生量，量生数，数生称，称生胜。", "故胜兵若以镒称铢，败兵若以铢称镒。胜者之战，若决积水于千仞之溪者，形也。"], "note": ["「不可勝在已」，通行本作「不可勝在己」。底本「己」多写作「已」，系形近通用，全书同例（如「勝已敗者也」「使人備已者也」）。"]}, {"n": "第五", "t": "兵勢篇", "s": "兵势篇", "p": ["孫子曰：凡治衆如治寡，分數是也；鬭衆如鬭寡，形名是也；三軍之衆，可使必受敵而無敗者，竒正是也；兵之所加，如以碬投卵者，虚實是也。", "凡戰者，以正合，以竒勝。故善出竒者，無窮如天地，不竭如江海。終而復始，日月是也；死而復生，四時是也。", "聲不過五，五聲之變，不可勝聽也；色不過五，五色之變，不可勝觀也；味不過五，五味之變，不可勝嘗也。戰勢不過竒正，竒正之變，不可勝窮也。竒正相生，如循環之無端，孰能窮之哉？", "激水之疾，至於漂石者，勢也；鷙鳥之疾，至於毁折者，節也。故善戰者，其勢險，其節短。勢如彍弩，節如發機。", "紛紛紜紜，鬭亂而不可亂；渾渾沌沌，形圓而不可敗。亂生於治，怯生於勇，弱生於强。治亂，數也；勇怯，形也。", "故善動敵者，形之，敵必從之；予之，敵必取之。以利動之，以本待之。", "故善戰者，求之於勢，不責之於人，故能擇人而任勢。任勢者，其戰人也，如轉木石。木石之性，安則靜，危則動，方則止，圓則行。", "故善戰人之勢，如轉圓石於千仞之山者，勢也。"], "ps": ["孙子曰：凡治众如治寡，分数是也；斗众如斗寡，形名是也；三军之众，可使必受敌而无败者，奇正是也；兵之所加，如以碫投卵者，虚实是也。", "凡战者，以正合，以奇胜。故善出奇者，无穷如天地，不竭如江海。终而复始，日月是也；死而复生，四时是也。", "声不过五，五声之变，不可胜听也；色不过五，五色之变，不可胜观也；味不过五，五味之变，不可胜尝也。战势不过奇正，奇正之变，不可胜穷也。奇正相生，如循环之无端，孰能穷之哉？", "激水之疾，至于漂石者，势也；鸷鸟之疾，至于毁折者，节也。故善战者，其势险，其节短。势如彍弩，节如发机。", "纷纷纭纭，斗乱而不可乱；浑浑沌沌，形圆而不可败。乱生于治，怯生于勇，弱生于强。治乱，数也；勇怯，形也。", "故善动敌者，形之，敌必从之；予之，敌必取之。以利动之，以本待之。", "故善战者，求之于势，不责之于人，故能择人而任势。任势者，其战人也，如转木石。木石之性，安则静，危则动，方则止，圆则行。", "故善战人之势，如转圆石于千仞之山者，势也。"], "note": ["「治亂，數也；勇怯，形也」，《集注》本作「治亂，數也；勇怯，勢也；強弱，形也」，底本脱「勢也強弱」四字。", "「以利動之，以本待之」，通行本作「以卒待之」。"]}, {"n": "第六", "t": "虚實篇", "s": "虚实篇", "p": ["孫子曰：凡先處戰地而待敵者佚，後處戰地而趨戰者勞。故善戰者，致人而不致於人。", "能使敵人自至者，利之也；能使敵人不得至者，害之也。故敵佚能勞之，飽能饑之，安能動之。", "出其所不趨，趨其所不意。行千里而不勞者，行於無人之地也。", "攻而必取者，攻其所不守也；守而必固者，守其所不攻也。故善攻者，敵不知其所守；善守者，敵不知其所攻。", "微乎微乎，至於無形；神乎神乎，至於無聲。故能為敵之司命。", "進而不可禦者，衝其虚也；退而不可追者，速而不可及也。", "故我欲戰，敵雖高壘深溝，不得不與我戰者，攻其所必救也；我不欲戰，雖畫地而守之，敵不得與我戰者，乖其所之也。", "故形人而我無形，則我專而敵分。我專為一，敵分為十，是以十攻其一也，則我衆敵寡。能以衆擊寡，則吾之所與戰者約矣。", "吾所與戰之地不可知，不可知，則敵所備者多；敵所備者多，則吾所與戰者寡矣。故備前則後寡，備後則前寡，備左則右寡，備右則左寡，無所不備，則無所不寡。寡者，備人者也；衆者，使人備已者也。", "故知戰之地，知戰之日，則可千里而㑹戰。不知戰地，不知戰日，則左不能救右，右不能救左，前不能救後，後不能救前，而况逺者數十里，近者數里乎？", "以吳度之，越人之兵雖多，亦奚益於勝哉？故曰：勝可為也。敵雖衆，可使無鬭。", "故䇿之而知得失之計，作之而知動靜之理，形之而知死生之地，角之而知有餘不足之處。故形兵之極，至於無形；無形，則深間不能窺，智者不能謀。", "因形而措勝於衆，衆不能知。人皆知我所以勝之形，而莫知吾所以制勝之形。故其戰勝不復，而應形於無窮。", "夫兵形象水：水之形，避高而趨下；兵之形，避實而擊虚。水因地而制流，兵因敵而制勝。故兵無常勢，水無常形，能因敵變化而取勝者，謂之神。", "故五行無常勝，四時無常位，日有短長，月有死生。"], "ps": ["孙子曰：凡先处战地而待敌者佚，后处战地而趋战者劳。故善战者，致人而不致于人。", "能使敌人自至者，利之也；能使敌人不得至者，害之也。故敌佚能劳之，饱能饥之，安能动之。", "出其所不趋，趋其所不意。行千里而不劳者，行于无人之地也。", "攻而必取者，攻其所不守也；守而必固者，守其所不攻也。故善攻者，敌不知其所守；善守者，敌不知其所攻。", "微乎微乎，至于无形；神乎神乎，至于无声。故能为敌之司命。", "进而不可御者，冲其虚也；退而不可追者，速而不可及也。", "故我欲战，敌虽高垒深沟，不得不与我战者，攻其所必救也；我不欲战，虽画地而守之，敌不得与我战者，乖其所之也。", "故形人而我无形，则我专而敌分。我专为一，敌分为十，是以十攻其一也，则我众敌寡。能以众击寡，则吾之所与战者约矣。", "吾所与战之地不可知，不可知，则敌所备者多；敌所备者多，则吾所与战者寡矣。故备前则后寡，备后则前寡，备左则右寡，备右则左寡，无所不备，则无所不寡。寡者，备人者也；众者，使人备已者也。", "故知战之地，知战之日，则可千里而会战。不知战地，不知战日，则左不能救右，右不能救左，前不能救后，后不能救前，而况远者数十里，近者数里乎？", "以吴度之，越人之兵虽多，亦奚益于胜哉？故曰：胜可为也。敌虽众，可使无斗。", "故策之而知得失之计，作之而知动静之理，形之而知死生之地，角之而知有余不足之处。故形兵之极，至于无形；无形，则深间不能窥，智者不能谋。", "因形而措胜于众，众不能知。人皆知我所以胜之形，而莫知吾所以制胜之形。故其战胜不复，而应形于无穷。", "夫兵形象水：水之形，避高而趋下；兵之形，避实而击虚。水因地而制流，兵因敌而制胜。故兵无常势，水无常形，能因敌变化而取胜者，谓之神。", "故五行无常胜，四时无常位，日有短长，月有死生。"], "note": ["「以吳度之」，通行本作「以吾度之」；一说孙武为吳臣，称「吳」亦有据。", "「十攻其一也」，底本作「十攻其一」，通行本「十」下有「而」字。"]}, {"n": "第七", "t": "軍爭篇", "s": "军争篇", "p": ["孫子曰：凡用兵之法，將受命於君，合軍聚衆，交和而舎，莫難於軍爭。", "軍爭之難者，以迂為直，以患為利。故迂其途，而誘之以利，後人發，先人至，此知迂直之計者也。", "故軍爭為利，衆爭為危。舉軍而爭利則不及，委軍而爭利則輜重捐。", "是故卷甲而趨，日夜不處，倍道兼行，百里而爭利，則擒三將軍，勁者先，疲者後，其法十一而至；五十里而爭利，則蹶上將軍，其法半至；三十里而爭利，則三分之二至。", "是故軍無輜重則亡，無糧食則亡，無委積則亡。", "故不知諸侯之謀者，不能豫交；不知山林、險阻、沮澤之形者，不能行軍；不用鄉導者，不能得地利。", "故兵以詐立，以利動，以分合為變者也。故其疾如風，其徐如林，侵掠如火，不動如山，難知如陰，動如雷震。掠鄉分衆，廓地分利，懸權而動。先知迂直之計者勝，此軍爭之法也。", "軍政曰：言不相聞，故為之金鼓；視不相見，故為之旌旗。夫金鼓旌旗者，所以一人之耳目也。人既專一，則勇者不得獨進，怯者不得獨退，此用衆之法也。故夜戰多火鼓，晝戰多旌旗，所以變人之耳目也。", "三軍可奪氣，將軍可奪心。是故朝氣鋭，晝氣惰，暮氣歸。善用兵者，避其鋭氣，擊其惰歸，此治氣者也。以治待亂，以靜待譁，此治心者也。以近待逺，以佚待勞，以飽待饑，此治力者也。無邀正正之旗，無擊堂堂之陣，此治變者也。", "故用兵之法：高陵勿向，背丘勿逆，佯北勿從，鋭卒勿攻，餌兵勿食，歸師勿遏，圍師必闕，窮寇勿追。此用兵之法也。"], "ps": ["孙子曰：凡用兵之法，将受命于君，合军聚众，交和而舍，莫难于军争。", "军争之难者，以迂为直，以患为利。故迂其途，而诱之以利，后人发，先人至，此知迂直之计者也。", "故军争为利，众争为危。举军而争利则不及，委军而争利则辎重捐。", "是故卷甲而趋，日夜不处，倍道兼行，百里而争利，则擒三将军，劲者先，疲者后，其法十一而至；五十里而争利，则蹶上将军，其法半至；三十里而争利，则三分之二至。", "是故军无辎重则亡，无粮食则亡，无委积则亡。", "故不知诸侯之谋者，不能豫交；不知山林、险阻、沮泽之形者，不能行军；不用乡导者，不能得地利。", "故兵以诈立，以利动，以分合为变者也。故其疾如风，其徐如林，侵掠如火，不动如山，难知如阴，动如雷震。掠乡分众，廓地分利，悬权而动。先知迂直之计者胜，此军争之法也。", "军政曰：言不相闻，故为之金鼓；视不相见，故为之旌旗。夫金鼓旌旗者，所以一人之耳目也。人既专一，则勇者不得独进，怯者不得独退，此用众之法也。故夜战多火鼓，昼战多旌旗，所以变人之耳目也。", "三军可夺气，将军可夺心。是故朝气锐，昼气惰，暮气归。善用兵者，避其锐气，击其惰归，此治气者也。以治待乱，以静待哗，此治心者也。以近待远，以佚待劳，以饱待饥，此治力者也。无邀正正之旗，无击堂堂之阵，此治变者也。", "故用兵之法：高陵勿向，背丘勿逆，佯北勿从，锐卒勿攻，饵兵勿食，归师勿遏，围师必阙，穷寇勿追。此用兵之法也。"], "note": ["「故軍爭為利，衆爭為危」，通行本作「軍爭為利，軍爭為危」。"]}, {"n": "第八", "t": "九變篇", "s": "九变篇", "p": ["孫子曰：凡用兵之法，將受命於君，合軍聚衆，圮地無舎，衢地合交，絶地無留，圍地則謀，死地則戰。", "途有所不由，軍有所不擊，城有所不攻，地有所不爭，君命有所不受。故將通於九變之利者，知用兵矣。", "將不通於九變之利，雖知地形，不能得地之利矣；治兵不通九變之術，雖知五利，不能得人之用矣。", "是故智者之慮，必雜於利害。雜於利而務可信也，雜於害而患可解也。", "是故屈諸侯者以害，役諸侯者以業，趨諸侯者以利。故用兵之法，無恃其不來，恃吾有以待之；無恃其不攻，恃吾有所不可攻也。", "故將有五危：必死可殺，必生可虜，忿速可侮，廉潔可辱，愛民可煩。凡此五者，將之過也，用兵之災也。覆軍殺將，必以五危，不可不察也。"], "ps": ["孙子曰：凡用兵之法，将受命于君，合军聚众，圮地无舍，衢地合交，绝地无留，围地则谋，死地则战。", "途有所不由，军有所不击，城有所不攻，地有所不争，君命有所不受。故将通于九变之利者，知用兵矣。", "将不通于九变之利，虽知地形，不能得地之利矣；治兵不通九变之术，虽知五利，不能得人之用矣。", "是故智者之虑，必杂于利害。杂于利而务可信也，杂于害而患可解也。", "是故屈诸侯者以害，役诸侯者以业，趋诸侯者以利。故用兵之法，无恃其不来，恃吾有以待之；无恃其不攻，恃吾有所不可攻也。", "故将有五危：必死可杀，必生可虏，忿速可侮，廉洁可辱，爱民可烦。凡此五者，将之过也，用兵之灾也。覆军杀将，必以五危，不可不察也。"], "note": []}, {"n": "第九", "t": "行軍篇", "s": "行军篇", "p": ["孫子曰：凡處軍相敵，絶山依谷，視生處高，戰隆無登，此處山之軍也。", "絶水必逺水。客絶水而來，勿迎之於水内，令半渡而擊之，利；欲戰者，無附水而迎客。視生處高，無迎水流，此處水上之軍也。", "絶斥澤，唯亟去勿留；若交軍於斥澤之中，必依水草而背衆樹，此處斥澤之軍也。", "平陵處易，右背高，前死後生，此處平陸之軍也。凡此四軍之利，黄帝之所以勝四帝也。", "凡軍好高而惡下，貴陽而賤陰，養生處實，軍無百疾，是謂必勝。丘陵隄防，必處其陽，而右背之。此兵之利，地之助也。", "上雨，水沫至，欲涉者，待其定也。", "凡地有絶澗、天井、天牢、天羅、天滔、天隙，必亟去之，勿近也。吾逺之，敵近之；吾迎之，敵背之。", "軍旁有險阻、潢井、林木、蒹葭、翳薈者，必謹覆索之，此伏姦之所也。", "近而靜者，恃其險也；逺而挑戰者，欲人之進也；其所居易者，利也。", "衆樹動者，來也；衆草多障者，疑也；鳥起者，伏也；獸駭者，覆也；塵高而鋭者，車來也；卑而廣者，徒來也；散而條達者，樵採也；少而往來者，營軍也。", "辭卑而益備者，進也；辭强而進驅者，退也；輕車先出居其側者，陣也；無約而請和者，謀也；奔走而陳兵者，期也；半進半退者，誘也。", "仗而立者，饑也；汲而先飲者，渴也；見利而不知進者，勞也；鳥集者，虚也；夜呼者，恐也；軍擾者，將不重也；旌旗動者，亂也；吏怒者，倦也；殺馬食肉者，軍無糧也；懸缻不返其舎者，窮寇也。", "諄諄翕翕，徐與人言者，失衆也；數賞者，窘也；數罰者，困也；先暴而後畏其衆者，不精之至也；來委謝者，欲休息也。兵怒而相迎，久而不合，又不相去，必謹察之。", "兵非貴益多，惟無武進，足以併力、料敵、取人而已。夫惟無慮而易敵者，必擒於人。", "卒未親附而罰之，則不服，不服則難用也；卒已親附而罰不行，則不可用也。故令之以文，齊之以武，是謂必取。令素行以教其民，則民服；令不素行以教其民，則民不服。令素行者，與衆相得也。"], "ps": ["孙子曰：凡处军相敌，绝山依谷，视生处高，战隆无登，此处山之军也。", "绝水必远水。客绝水而来，勿迎之于水内，令半渡而击之，利；欲战者，无附水而迎客。视生处高，无迎水流，此处水上之军也。", "绝斥泽，唯亟去勿留；若交军于斥泽之中，必依水草而背众树，此处斥泽之军也。", "平陵处易，右背高，前死后生，此处平陆之军也。凡此四军之利，黄帝之所以胜四帝也。", "凡军好高而恶下，贵阳而贱阴，养生处实，军无百疾，是谓必胜。丘陵堤防，必处其阳，而右背之。此兵之利，地之助也。", "上雨，水沫至，欲涉者，待其定也。", "凡地有绝涧、天井、天牢、天罗、天滔、天隙，必亟去之，勿近也。吾远之，敌近之；吾迎之，敌背之。", "军旁有险阻、潢井、林木、蒹葭、翳荟者，必谨覆索之，此伏奸之所也。", "近而静者，恃其险也；远而挑战者，欲人之进也；其所居易者，利也。", "众树动者，来也；众草多障者，疑也；鸟起者，伏也；兽骇者，覆也；尘高而锐者，车来也；卑而广者，徒来也；散而条达者，樵采也；少而往来者，营军也。", "辞卑而益备者，进也；辞强而进驱者，退也；轻车先出居其侧者，阵也；无约而请和者，谋也；奔走而陈兵者，期也；半进半退者，诱也。", "仗而立者，饥也；汲而先饮者，渴也；见利而不知进者，劳也；鸟集者，虚也；夜呼者，恐也；军扰者，将不重也；旌旗动者，乱也；吏怒者，倦也；杀马食肉者，军无粮也；悬缶不返其舍者，穷寇也。", "谆谆翕翕，徐与人言者，失众也；数赏者，窘也；数罚者，困也；先暴而后畏其众者，不精之至也；来委谢者，欲休息也。兵怒而相迎，久而不合，又不相去，必谨察之。", "兵非贵益多，惟无武进，足以并力、料敌、取人而已。夫惟无虑而易敌者，必擒于人。", "卒未亲附而罚之，则不服，不服则难用也；卒已亲附而罚不行，则不可用也。故令之以文，齐之以武，是谓必取。令素行以教其民，则民服；令不素行以教其民，则民不服。令素行者，与众相得也。"], "note": ["「令半渡而擊之」，通行本作「令半濟而擊之」。", "「平陵處易」，通行本作「平陸處易」。", "「天羅、天滔、天隙」，通行本作「天陷」；《集注》本正作「天陷」，底本形近而误。", "「殺馬食肉者，軍無糧也」，通行本作「粟馬肉食，軍無懸缻」。"]}, {"n": "第十", "t": "地形篇", "s": "地形篇", "p": ["孫子曰：地形有通者，有掛者，有支者，有隘者，有險者，有逺者。", "我可以往，彼可以來，曰通。通形者，先居高陽，利糧道，以戰則利。", "可以往，難以返，曰掛。掛形者，敵無備，出而勝之；敵若有備，出而不勝，難以返，不利。", "我出而不利，彼出而不利，曰支。支形者，敵雖利我，我無出也，引而去之，令敵半出而擊之，利。", "隘形者，我先居之，必盈之以待敵；若敵先居之，盈而勿從，不盈而從之。", "險形者，我先居之，必居高陽以待敵；若敵先居之，引而去之，勿從也。", "逺形者，勢均，難以挑戰，戰而不利。凡此六者，地之道也，將之至任，不可不察也。", "故兵有走者，有弛者，有陷者，有崩者，有亂者，有北者。凡此六者，非天地之災，將之過也。", "夫勢均，以一擊十，曰走；卒强吏弱，曰弛；吏强卒弱，曰陷；大吏怒而不服，遇敵懟而自戰，將不知其能，曰崩；將弱不嚴，教道不明，吏卒無常，陳兵縱横，曰亂；將不能料敵，以少合衆，以弱擊强，兵無選鋒，曰北。凡此六者，敗之道也，將之至任，不可不察也。", "夫地形者，兵之助也。料敵制勝，計險阨逺近，上將之道也。知此而用戰者必勝，不知此而用戰者必敗。", "故戰道必勝，主曰無戰，必戰可也；戰道不勝，主曰必戰，無戰可也。故進不求名，退不避罪，惟民是保，而利於主，國之寶也。", "視卒如嬰兒，故可與之赴深谿；視卒如愛子，故可與之俱死。愛而不能令，厚而不能使，亂而不能治，譬如驕子，不可用也。", "知吾卒之可以擊，而不知敵之不可擊，勝之半也；知敵之可擊，而不知吾卒之不可以擊，勝之半也；知敵之可擊，知吾卒之可以擊，而不知地形之不可以戰，勝之半也。", "故知兵者，動而不迷，舉而不窮。故曰：知彼知己，勝乃不殆；知天知地，勝乃可全。"], "ps": ["孙子曰：地形有通者，有挂者，有支者，有隘者，有险者，有远者。", "我可以往，彼可以来，曰通。通形者，先居高阳，利粮道，以战则利。", "可以往，难以返，曰挂。挂形者，敌无备，出而胜之；敌若有备，出而不胜，难以返，不利。", "我出而不利，彼出而不利，曰支。支形者，敌虽利我，我无出也，引而去之，令敌半出而击之，利。", "隘形者，我先居之，必盈之以待敌；若敌先居之，盈而勿从，不盈而从之。", "险形者，我先居之，必居高阳以待敌；若敌先居之，引而去之，勿从也。", "远形者，势均，难以挑战，战而不利。凡此六者，地之道也，将之至任，不可不察也。", "故兵有走者，有弛者，有陷者，有崩者，有乱者，有北者。凡此六者，非天地之灾，将之过也。", "夫势均，以一击十，曰走；卒强吏弱，曰弛；吏强卒弱，曰陷；大吏怒而不服，遇敌怼而自战，将不知其能，曰崩；将弱不严，教道不明，吏卒无常，陈兵纵横，曰乱；将不能料敌，以少合众，以弱击强，兵无选锋，曰北。凡此六者，败之道也，将之至任，不可不察也。", "夫地形者，兵之助也。料敌制胜，计险厄远近，上将之道也。知此而用战者必胜，不知此而用战者必败。", "故战道必胜，主曰无战，必战可也；战道不胜，主曰必战，无战可也。故进不求名，退不避罪，惟民是保，而利于主，国之宝也。", "视卒如婴儿，故可与之赴深溪；视卒如爱子，故可与之俱死。爱而不能令，厚而不能使，乱而不能治，譬如骄子，不可用也。", "知吾卒之可以击，而不知敌之不可击，胜之半也；知敌之可击，而不知吾卒之不可以击，胜之半也；知敌之可击，知吾卒之可以击，而不知地形之不可以战，胜之半也。", "故知兵者，动而不迷，举而不穷。故曰：知彼知己，胜乃不殆；知天知地，胜乃可全。"], "note": ["「知天知地，勝乃可全」，通行本作「勝乃不窮」。"]}, {"n": "第十一", "t": "九地篇", "s": "九地篇", "p": ["孫子曰：用兵之法，有散地，有輕地，有爭地，有交地，有衢地，有重地，有圮地，有圍地，有死地。", "諸侯自戰其地者，為散地；入人之地而不深者，為輕地；我得亦利，彼得亦利者，為爭地；我可以往，彼可以來者，為交地；諸侯之地三屬，先至而得天下之衆者，為衢地；入人之地深，背城邑多者，為重地；山林、險阻、沮澤，凡難行之道者，為圮地；所由入者隘，所從歸者迂，彼寡可以擊吾之衆者，為圍地；疾戰則存，不疾戰則亡者，為死地。", "是故散地則無戰，輕地則無止，爭地則無攻，交地則無絶，衢地則合交，重地則掠，圮地則行，圍地則謀，死地則戰。", "古之所謂善用兵者，能使敵人前後不相及，衆寡不相恃，貴賤不相救，上下不相收，卒離而不集，兵合而不齊。合於利而動，不合於利而止。", "敢問：敵衆整而將來，待之若何？曰：先奪其所愛，則聽矣。兵之情主速，乗人之不及，由不虞之道，攻其所不戒也。", "凡為客之道：深入則專，主人不克；掠於饒野，三軍足食；謹養而勿勞，并氣積力，運兵計謀，為不可測。", "投之無所往，死且不北；死焉不得，士人盡力。兵卒甚陷則不懼，無所往則固，入深則拘，不得已則鬭。", "是故其兵不修而戒，不求而得，不約而親，不令而信，禁祥去疑，至死無所之。吾士無餘財，非惡貨也；無餘命，非惡夀也。令發之日，士卒坐者涕沾襟，偃卧者涕交頤。投之無所往，則諸劌之勇也。", "故嘗用兵者，譬如率然。率然者，常山之蛇也，擊其首則尾至，擊其尾則首至，擊其中則首尾俱至。敢問：可使如率然乎？曰：可。", "夫吳人與越人相惡也，當其同舟濟而遇風，其相救也如左右手。是故方馬埋輪，未足恃也；齊勇若一，政之道也；剛柔皆得，地之理也。故善用兵者，擕手若使一人，不得已也。", "將軍之事，靜以幽，正以治。能愚士卒之耳目，使之無知。易其事，革其謀，使人無識；易其居，迂其途，使人不得慮。", "帥與之期，若登高而去其梯；帥與之深入諸侯之地，而發其機，若驅羣羊，驅而往，驅而來，莫知所之。聚三軍之衆，投之于險，此將軍之事也。九地之變，屈伸之利，人情之理，不可不察也。", "凡為客之道：深則專，淺則散。去國越境而師者，絶地也；四通者，衢地也；入深者，重地也；入淺者，輕地也；背固前隘者，圍地也；無所往者，死地也。", "是故散地，吾將一其志；輕地，吾將使之屬；爭地，吾將趨其後；交地，吾將謹其守；衢地，吾將固其結；重地，吾將繼其食；圮地，吾將進其途；圍地，吾將塞其闕；死地，吾將示之以不活。", "故兵之情：圍則禦，不得已則鬭，過則從。", "是故不知諸侯之謀者，不能豫交；不知山林、險阻、沮澤之形者，不能行軍；不用鄉導者，不能得地利。四五者，一不知，非霸王之兵也。", "夫霸王之兵，伐大國，則其衆不得聚；威加於敵，則其交不得合。是故不爭天下之交，不養天下之權，信已之私，威加於敵，故其城可拔，其國可隳。", "施無法之賞，懸無政之令，犯三軍之衆，若使一人。犯之以事，勿告以言；犯之以利，勿告以害。", "投之亡地然後存，陷之死地然後生。夫衆陷於害，然後能為勝敗。", "夫為兵之事，在順詳敵之意，并力一向，千里殺將，是謂巧能成事。", "是故政舉之日，夷闗折符，無通其使，厲於廊廟之上，以誅其事。敵人開闔，必亟入之；先其所愛，微與之期；踐墨隨敵，以決戰事。", "是故始如處女，敵人開户；後如脫兔，敵不及拒。"], "ps": ["孙子曰：用兵之法，有散地，有轻地，有争地，有交地，有衢地，有重地，有圮地，有围地，有死地。", "诸侯自战其地者，为散地；入人之地而不深者，为轻地；我得亦利，彼得亦利者，为争地；我可以往，彼可以来者，为交地；诸侯之地三属，先至而得天下之众者，为衢地；入人之地深，背城邑多者，为重地；山林、险阻、沮泽，凡难行之道者，为圮地；所由入者隘，所从归者迂，彼寡可以击吾之众者，为围地；疾战则存，不疾战则亡者，为死地。", "是故散地则无战，轻地则无止，争地则无攻，交地则无绝，衢地则合交，重地则掠，圮地则行，围地则谋，死地则战。", "古之所谓善用兵者，能使敌人前后不相及，众寡不相恃，贵贱不相救，上下不相收，卒离而不集，兵合而不齐。合于利而动，不合于利而止。", "敢问：敌众整而将来，待之若何？曰：先夺其所爱，则听矣。兵之情主速，乘人之不及，由不虞之道，攻其所不戒也。", "凡为客之道：深入则专，主人不克；掠于饶野，三军足食；谨养而勿劳，并气积力，运兵计谋，为不可测。", "投之无所往，死且不北；死焉不得，士人尽力。兵卒甚陷则不惧，无所往则固，入深则拘，不得已则斗。", "是故其兵不修而戒，不求而得，不约而亲，不令而信，禁祥去疑，至死无所之。吾士无余财，非恶货也；无余命，非恶寿也。令发之日，士卒坐者涕沾襟，偃卧者涕交颐。投之无所往，则诸刿之勇也。", "故尝用兵者，譬如率然。率然者，常山之蛇也，击其首则尾至，击其尾则首至，击其中则首尾俱至。敢问：可使如率然乎？曰：可。", "夫吴人与越人相恶也，当其同舟济而遇风，其相救也如左右手。是故方马埋轮，未足恃也；齐勇若一，政之道也；刚柔皆得，地之理也。故善用兵者，携手若使一人，不得已也。", "将军之事，静以幽，正以治。能愚士卒之耳目，使之无知。易其事，革其谋，使人无识；易其居，迂其途，使人不得虑。", "帅与之期，若登高而去其梯；帅与之深入诸侯之地，而发其机，若驱群羊，驱而往，驱而来，莫知所之。聚三军之众，投之于险，此将军之事也。九地之变，屈伸之利，人情之理，不可不察也。", "凡为客之道：深则专，浅则散。去国越境而师者，绝地也；四通者，衢地也；入深者，重地也；入浅者，轻地也；背固前隘者，围地也；无所往者，死地也。", "是故散地，吾将一其志；轻地，吾将使之属；争地，吾将趋其后；交地，吾将谨其守；衢地，吾将固其结；重地，吾将继其食；圮地，吾将进其途；围地，吾将塞其阙；死地，吾将示之以不活。", "故兵之情：围则御，不得已则斗，过则从。", "是故不知诸侯之谋者，不能豫交；不知山林、险阻、沮泽之形者，不能行军；不用乡导者，不能得地利。四五者，一不知，非霸王之兵也。", "夫霸王之兵，伐大国，则其众不得聚；威加于敌，则其交不得合。是故不争天下之交，不养天下之权，信已之私，威加于敌，故其城可拔，其国可隳。", "施无法之赏，悬无政之令，犯三军之众，若使一人。犯之以事，勿告以言；犯之以利，勿告以害。", "投之亡地然后存，陷之死地然后生。夫众陷于害，然后能为胜败。", "夫为兵之事，在顺详敌之意，并力一向，千里杀将，是谓巧能成事。", "是故政举之日，夷关折符，无通其使，厉于廊庙之上，以诛其事。敌人开阖，必亟入之；先其所爱，微与之期；践墨随敌，以决战事。", "是故始如处女，敌人开户；后如脱兔，敌不及拒。"], "note": ["「信已之私」，通行本作「信己之私」。", "「四五者，一不知」，通行本断作「四五者，不知一」。"]}, {"n": "第十二", "t": "火攻篇", "s": "火攻篇", "p": ["孫子曰：凡火攻有五：一曰火人，二曰火積，三曰火輜，四曰火庫，五曰火隊。", "行火必有因，烟火必素具。發火有時，起火有日。時者，天之燥也；日者，月在箕、壁、翼、軫也。凡此四宿者，風起之日也。", "凡火攻，必因五火之變而應之。火發於内，即早應之於外。火發而其兵靜者，待而勿攻。極其火力，可從而從之，不可從則止。火可發於外，無待於内，以時發之。火發上風，無攻下風。晝風久，夜風止。", "凡軍必知五火之變，以數守之。故以火佐攻者明，以水佐攻者强。水可以絶，不可以奪。", "夫戰勝攻取，而不修其功者凶，命曰費留。故曰：明主慮之，良將修之。非利不動，非得不用，非危不戰。", "主不可以怒而興師，將不可以愠而致戰。合於利而動，不合於利而止。怒可以復喜，愠可以復悦；亡國不可以復存，死者不可以復生。故曰：明主愼之，良將警之，此安國全軍之道也。"], "ps": ["孙子曰：凡火攻有五：一曰火人，二曰火积，三曰火辎，四曰火库，五曰火队。", "行火必有因，烟火必素具。发火有时，起火有日。时者，天之燥也；日者，月在箕、壁、翼、轸也。凡此四宿者，风起之日也。", "凡火攻，必因五火之变而应之。火发于内，即早应之于外。火发而其兵静者，待而勿攻。极其火力，可从而从之，不可从则止。火可发于外，无待于内，以时发之。火发上风，无攻下风。昼风久，夜风止。", "凡军必知五火之变，以数守之。故以火佐攻者明，以水佐攻者强。水可以绝，不可以夺。", "夫战胜攻取，而不修其功者凶，命曰费留。故曰：明主虑之，良将修之。非利不动，非得不用，非危不战。", "主不可以怒而兴师，将不可以愠而致战。合于利而动，不合于利而止。怒可以复喜，愠可以复悦；亡国不可以复存，死者不可以复生。故曰：明主慎之，良将警之，此安国全军之道也。"], "note": []}, {"n": "第十三", "t": "用間篇", "s": "用间篇", "p": ["孫子曰：凡興師十萬，出征千里，百姓之費，公家之奉，日費千金；内外騷動，怠於道路，不得操事者，七十萬家。", "相守數年，以爭一日之勝，而愛爵禄百金，不知敵之情者，不仁之至也。非人之將也，非主之佐也，非勝之主也。", "故明君賢將，所以動而勝人，成功出於衆者，先知也。先知者，不可取於鬼神，不可象於事，不可驗於度，必取於人，而知敵之情者也。", "故用間有五：有鄉間，有内間，有反間，有死間，有生間。五間俱起，莫知其道，是謂神紀，人君之寶也。", "鄉間者，因其鄉人而用之；内間者，因其官人而用之；反間者，因其敵間而用之；死間者，為誑事於外，令吾間知之，而傳於敵國也；生間者，反報也。", "故三軍之事，莫親於間，賞莫厚於間，事莫宻於間。非聖智不能用間，非仁義不能使間，非微妙不能得間之實。微哉！微哉！無所不用間也。", "間事未發而先聞者，聞與所告者皆死。", "凡軍之所欲擊，城之所欲攻，人之所欲殺，必先知其守將、左右、謁者、門者、舎人之姓名，令吾間必索知之。", "必索敵間之來間我者，因而利之，導而舎之，故反間可得而使也。因是而知之，故鄉間、内間可得而使也；因是而知之，故死間為誑事，可使告敵；因是而知之，故生間可使如期。", "五間之事，主必知之，知之必在反間，故反間不可不厚也。", "昔殷之興也，伊摰在夏；周之興也，吕牙在商。故明君賢將，能以上智為間者，必成大功。此兵之要，三軍之所恃而動也。"], "ps": ["孙子曰：凡兴师十万，出征千里，百姓之费，公家之奉，日费千金；内外骚动，怠于道路，不得操事者，七十万家。", "相守数年，以争一日之胜，而爱爵禄百金，不知敌之情者，不仁之至也。非人之将也，非主之佐也，非胜之主也。", "故明君贤将，所以动而胜人，成功出于众者，先知也。先知者，不可取于鬼神，不可象于事，不可验于度，必取于人，而知敌之情者也。", "故用间有五：有乡间，有内间，有反间，有死间，有生间。五间俱起，莫知其道，是谓神纪，人君之宝也。", "乡间者，因其乡人而用之；内间者，因其官人而用之；反间者，因其敌间而用之；死间者，为诳事于外，令吾间知之，而传于敌国也；生间者，反报也。", "故三军之事，莫亲于间，赏莫厚于间，事莫密于间。非圣智不能用间，非仁义不能使间，非微妙不能得间之实。微哉！微哉！无所不用间也。", "间事未发而先闻者，闻与所告者皆死。", "凡军之所欲击，城之所欲攻，人之所欲杀，必先知其守将、左右、谒者、门者、舍人之姓名，令吾间必索知之。", "必索敌间之来间我者，因而利之，导而舍之，故反间可得而使也。因是而知之，故乡间、内间可得而使也；因是而知之，故死间为诳事，可使告敌；因是而知之，故生间可使如期。", "五间之事，主必知之，知之必在反间，故反间不可不厚也。", "昔殷之兴也，伊挚在夏；周之兴也，吕牙在商。故明君贤将，能以上智为间者，必成大功。此兵之要，三军之所恃而动也。"], "note": ["「伊摰在夏」，通行本作「伊摯」（即伊尹）。", "卷末原有「孫子」二字为篇末题名，非正文，未录入。"]}];
let trad=false, showNote=true, size=19, io=null;
const body=document.getElementById('body'), toc=document.getElementById('toc');
function render(){
  body.innerHTML = D.map((c,i)=>{
    const ps=(trad?c.p:c.ps).map(x=>'<p>'+x+'</p>').join('');
    const nt = c.note.length
      ? '<div class="note'+(showNote?'':' hide')+'"><b>校记</b>'+c.note.map(n=>'<div>· '+n+'</div>').join('')+'</div>'
      : '';
    return '<h2 id="c'+i+'"><span class="no">'+c.n+'</span>'+(trad?c.t:c.s)+'</h2>'+ps+nt;
  }).join('');
  toc.innerHTML = D.map((c,i)=>'<a href="#c'+i+'">'+(trad?c.t:c.s)+'</a>').join('');
  let n=0; D.forEach(c=>c.p.forEach(x=>n+=x.replace(/[^一-鿿]/g,'').length));
  document.getElementById('cnt').textContent = '正文 '+n+' 字';
  const links=[...document.querySelectorAll('aside a')];
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){
    links.forEach(a=>a.classList.toggle('on', a.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('h2').forEach(h=>io.observe(h));
}
function swap(){ trad=!trad; document.getElementById('sw').textContent = trad?'显示简体':'显示繁体底本'; render(); }
function notes(){ showNote=!showNote; document.getElementById('nb').textContent = showNote?'收起源流校记':'展开源流校记';
  document.querySelectorAll('.note').forEach(e=>e.classList.toggle('hide',!showNote)); }
function fs(d){ size=Math.min(27,Math.max(15,size+d)); document.documentElement.style.setProperty('--fs',size+'px'); }

</script>
